- name: days_since_limit_down
  category: limit
  description: Trading days since most recent limit-down, including 0 if today; capped at 61.
  formula: min(trading_days_since_last(flag_limit_down==1),61)
  inputs:
  - flag_limit_down
  window: 61
  groupby: ts_code
  depends_on: []
  causal: true
  missing_rule: NaN if required history/input is unavailable or invalid.
  notes: If no event is observed in available history, use 61.
