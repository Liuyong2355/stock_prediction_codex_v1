- name: market_amount_ratio_20
  category: market
  description: Total market amount relative to its trailing 20-day mean.
  formula: market_amount_t / (rolling_mean(market_amount,20) + 1e-12); market_amount_t=sum_i(amount[i,t])
  inputs:
  - amount
  window: 20
  groupby: trade_date
  depends_on: []
  causal: true
  missing_rule: NaN if required history/input is unavailable or invalid.
  notes: First aggregate amount by trade_date, then compute causal 20-day rolling mean on the date series and join back.
