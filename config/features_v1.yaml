- name: kmid
  category: kbar
  description: Signed open-to-close body scaled by open.
  formula: (close-open)/(open+1e-12)
  inputs:
  - open
  - high
  - low
  - close
  window: 1
  groupby: ts_code
  depends_on: []
  causal: true
  missing_rule: NaN if required history/input is unavailable or invalid.
  notes: ''
- name: klen
