model: xgboost_reg_v1
target: rank
seed: 2026
postprocess: none
selection_priority:
  - ic_mean
  - annual_excess
  - cross_fold_stability
  - final_score
  - diagnostic_turnover
  - missing_top_fraction
success_rule: >-
  Continue only if the candidate has a positive mean IC or excess increment,
  improves at least two of three folds on the supporting signal metric, and the
  result is not explained by worse missing-label Top occupancy.
