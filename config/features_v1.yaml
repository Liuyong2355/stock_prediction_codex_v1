schema_version: '1.0'
feature_spec_version: '1.0.1'
global_conventions:
  key_columns:
  - ts_code
  - trade_date
  raw_source_columns:
  - open
  - high
  - low
  - close
  - vol
  - amount
  - flag_limit_up
  - flag_limit_down
  target_column: y_ret_1d
  epsilon: 1.0e-12
  rolling_order: ascending trade_date within each ts_code
  lag_unit: observed rows within ts_code, never filled market-calendar rows
  rolling_min_periods: window
  rolling_finite_requirement: exactly window finite values in the trailing window
  rolling_correlation_finite_requirement: exactly window paired finite values
  ema_min_periods: window
  cross_section_finite_only: true
  market_breadth_up_denominator: count of finite ret_1 on the same trade_date
  ols_r_squared_zero_variance: NaN
  missing_date_reindex_allowed: false
  forward_fill_allowed: false
  backfill_allowed: false
  rolling_windows_include_current_day: true
  std_ddof: 0
  cross_section: same trade_date only
  future_data_allowed: false
  inf_policy: replace +inf/-inf with NaN
  raw_ts_code_as_model_feature: false
  raw_absolute_ohlc_as_model_features: false
