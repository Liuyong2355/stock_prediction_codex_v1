features:
- name: ret_1
  category: return
  description: 1-trading-day close-to-close return.
  formula: close_t / lag(close,1) - 1
  inputs:
  - close
  window: 1
  groupby: ts_code
  depends_on: []
  causal: true
  missing_rule: NaN if required history/input is unavailable or invalid.
  notes: ''
